name: main

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.X

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: lint
        run: npm run lint

      - name: test
        run: node --experimental-vm-modules node_modules/.bin/jest --forceExit --config ./jest.config.js --coverage

      - name: build:dev
        if: github.ref != 'refs/heads/develop'
        run: npm run build:stg

      - name: build:prod
        if: github.ref == 'refs/heads/main'
        run: npm run build

      - name : upload coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/**
          retention-days: 5

      - name: upload dist
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/**
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: ./dist

      - name: Configure AWS credentials dev
        if: github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::520974854908:role/esdb-frontend-dev
          aws-region: ap-northeast-1

      - name: Configure AWS credentials prod
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::520974854908:role/esdb-frontend
          aws-region: ap-northeast-1

      - name: deploy dev
        if: github.ref == 'refs/heads/develop'
        run: cd dist && aws s3 sync . s3://esdb-frontend-dev --exact-timestamps --region ap-northeast-1

      - name: deploy prod
        if: github.ref == 'refs/heads/main'
        run: cd dist && aws s3 sync . s3://esdb-frontend --exact-timestamps --region ap-northeast-1