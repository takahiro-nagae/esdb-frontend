name: deploy

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - develop
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: ./dist

      - name: Configure AWS credentials dev
        if: github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::520974854908:role/esdb-frontend-dev
          aws-region: ap-northeast-1

      - name: Configure AWS credentials prod
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::520974854908:role/esdb-frontend
          aws-region: ap-northeast-1

      - name: deploy dev
        if: github.ref == 'refs/heads/develop'
        run: cd dist && aws s3 sync . s3://esdb-frontend-dev --exact-timestamps --region ap-northeast-1

      - name: deploy prod
        if: github.ref == 'refs/heads/main'
        run: cd dist && aws s3 sync . s3://esdb-frontend --exact-timestamps --region ap-northeast-1